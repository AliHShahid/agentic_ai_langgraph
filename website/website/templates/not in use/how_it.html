{% load static %}
<section class="relative h-[200vh] bg-black">

    <!-- Sticky stage -->
    <div class="sticky top-0 h-screen overflow-hidden flex items-center">

        <!-- Video container -->
        <div id="videoBox" class="absolute inset-0 transition-all duration-700 ease-out">

            <video autoplay muted loop playsinline class="w-full h-full object-cover">
                <source
                    src="https://cdn.prod.website-files.com/6719ad0ceed6d5aa24a83d61/6798985ffa243f5e7673e433_careers%20%281%29-transcode.mp4"
                    type="video/mp4">
            </video>

            <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <!-- Text -->
        <div id="careerText"
            class="relative z-10 max-w-xl px-10 text-white opacity-0 translate-x-[-50px] transition-all duration-700">
            <p class="uppercase tracking-widest text-orange-400 font-semibold">HOW IT WORKS
            </p>

            <h2 class="text-4xl md:text-5xl font-bold mt-4">
                A 3-Step Framework Built to Scale</h2>

            <p class="mt-6 text-white/80 text-lg">
                This isn’t just running ads. It’s a growth framework for profitable scaling.

            </p>
            <div class="pt-20 relative group inline-block">
                <a href="{% url 'how_it_works' %}#3steps"
                    class="relative inline-block p-px font-semibold leading-6 text-white bg-gray-800 shadow-2xl cursor-pointer rounded-xl shadow-zinc-900 transition-transform duration-300 ease-in-out hover:scale-105 active:scale-95">

                    <!-- Animated gradient border -->
                    <span
                        class="absolute inset-0 rounded-xl bg-gradient-to-r from-orange-400 via-pink-500 to-purple-500 p-[2px] opacity-0 transition-opacity duration-500 group-hover:opacity-100">
                    </span>

                    <!-- Button inner -->
                    <span class="relative z-10 block px-6 py-3 rounded-xl bg-gray-950">
                        <div class="relative z-10 flex items-center space-x-2">
                            <span class="transition-all duration-500 group-hover:translate-x-1">
                                Learn More </span>

                            <svg class="w-6 h-6 transition-transform duration-500 group-hover:translate-x-1"
                                fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd"
                                    d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                    </span>
                </a>
            </div>

        </div>

    </div>
</section>

<script>
    const video = document.getElementById("videoBox");
    const text = document.getElementById("careerText");

    window.addEventListener("scroll", () => {
        const scrollY = window.scrollY;
        const sectionTop = video.parentElement.parentElement.offsetTop;
        const sectionHeight = window.innerHeight * 2;

        const progress = Math.min(
            Math.max((scrollY - sectionTop) / window.innerHeight, 0),
            1
        );

        // Move video right as you scroll
        video.style.transform = `
      translateX(${progress * 40}%)
      scale(${1 - progress * 0.1})
    `;

        // Show text
        if (progress > 0.4) {
            text.classList.remove("opacity-0", "translate-x-[-50px]");
        } else {
            text.classList.add("opacity-0", "translate-x-[-50px]");
        }
    });
</script>
