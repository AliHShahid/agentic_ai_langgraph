<!-- Styles -->
<style>
    .nav-link {
        position: relative;
        padding: 0.5rem 1rem;
        transition: all 0.3s;
    }

    .nav-link::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: #FFD84A;
        transition: width 0.3s ease;
    }

    .nav-link:hover::before {
        width: 2.4rem;
    }

    .dropdown-link {
        display: block;
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
        color: white;
        transition: 0.2s;
    }

    .dropdown-link:hover {
        background: rgba(255, 216, 74, 0.12);
        color: #FFD84A;
    }


    .mobile-link {
        padding: 0.5rem 0;
    }
</style>

<!-- JS -->
<script>
    const menuBtn = document.getElementById("menuBtn");
    const mobileMenu = document.getElementById("mobileMenu");

    menuBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("max-h-[500px]");
    });

    const learnBtn = document.getElementById("learnBtn");
    const learnMenu = document.getElementById("learnMenu");

    learnBtn.addEventListener("click", () => {
        learnMenu.classList.toggle("opacity-0");
        learnMenu.classList.toggle("invisible");
    });

    const mobileLearnBtn = document.getElementById("mobileLearnBtn");
    const mobileLearnMenu = document.getElementById("mobileLearnMenu");

    mobileLearnBtn.addEventListener("click", () => {
        mobileLearnMenu.classList.toggle("hidden");
    });
</script>
