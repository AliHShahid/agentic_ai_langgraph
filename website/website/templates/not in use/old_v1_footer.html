<footer
    class="rounded-t-2xl overflow-hidden text-white bg-gradient-to-tr from-[#1a1a1a]/90 to-[#1a1a1a]/80 py-16 px-8 md:px-16">

    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12">

        <!-- BRAND + ABOUT -->
        <div class="space-y-6">
            <div class="text-4xl font-bold tracking-tight">
                AD<span class="text-[#FFD84A]">RYZE</span>
            </div>
            <p class="leading-relaxed font-sans text-white text-lg max-w-sm">
                Custom software solutions with precision engineering and cutting-edge technology to make life
                smarter, simpler, and more sustainable.
            </p>

            <!-- SOCIAL LINKS -->
            <div class="flex gap-4 pt-2">
                <a href="https://www.linkedin.com/company/ai-influx/"
                    class="hover:text-gray-200 transition text-sm font-medium">LinkedIn</a>
                <a href="#" class="hover:text-gray-200 transition text-sm font-medium">GitHub</a>
                <a href="#" class="hover:text-gray-200 transition text-sm font-medium">X (Twitter)</a>
                <a href="https://www.instagram.com/influx_ai/"
                    class="hover:text-gray-200 transition text-sm font-medium">Instagram</a>
            </div>
        </div>

        <!-- QUICK LINKS -->
        <div class="space-y-6">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-200">Navigation</h3>
            <ul class="space-y-2">
                <li><a href="{% url 'about' %}" class="text-white hover:text-gray-300 transition">About</a></li>
                <li><a href="#skills" class="text-white hover:text-gray-300 transition">Services</a></li>
                <li><a href="{% url 'case_study' %}" class="text-white hover:text-gray-300 transition">Case
                        Studies</a></li>
                <li><a href="#" class="text-white hover:text-gray-300 transition">Privacy & Terms</a></li>
            </ul>
        </div>

        <!-- CONTACT FORM -->
        <div id="contact" class="bg-[#1a1a1a] p-6 rounded-lg shadow-lg">
            <h3 class="text-sm font-semibold uppercase tracking-wider mb-4 text-white">Contact Us</h3>
            <form method="POST" action="{% url 'home' %}" class="space-y-4">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Name" required
                    class="w-full bg-white bg-opacity-10 backdrop-blur-sm rounded-lg px-4 py-3 text-sm text-white placeholder-gray-200 focus:ring-2 focus:ring-orange-400 outline-none transition">

                <input type="email" name="email" id="contact-email" placeholder="Email" required
                    class="w-full bg-white bg-opacity-10 backdrop-blur-sm rounded-lg px-4 py-3 text-sm text-white placeholder-gray-200 focus:ring-2 focus:ring-orange-400 outline-none transition">

                <input type="text" name="company" placeholder="Company" required
                    class="w-full bg-white bg-opacity-10 backdrop-blur-sm rounded-lg px-4 py-3 text-sm text-white placeholder-gray-200 focus:ring-2 focus:ring-orange-400 outline-none transition">
                <label for="package" class="block text-sm font-medium text-white mb-1">
                    Choose a package
                </label>

                <select id="package" name="package" required
                    class="w-full bg-white bg-opacity-10 backdrop-blur-sm rounded-lg px-4 py-3 text-sm text-white focus:ring-2 focus:ring-orange-400 outline-none transition">

                    <option value="" disabled selected class="text-black">-- Select a package --</option>
                    <option value="1000" class="text-black">1000 items</option>
                    <option value="2000" class="text-black">2000 items</option>
                    <option value="3000" class="text-black">3000 items</option>
                    <option value="custom" class="text-black">Custom items</option>

                </select>


                <input type="tel" name="phone" placeholder="Phone Number" required
                    class="w-full bg-white bg-opacity-10 backdrop-blur-sm rounded-lg px-4 py-3 text-sm text-white placeholder-gray-200 focus:ring-2 focus:ring-orange-400 outline-none transition">

                <textarea name="message" rows="3" placeholder="How can we help?"
                    class="w-full bg-white bg-opacity-10 backdrop-blur-sm rounded-lg px-4 py-3 text-sm text-white placeholder-gray-200 focus:ring-2 focus:ring-orange-400 outline-none transition"></textarea>

                <button type="submit"
                    class="w-full py-3 bg-white bg-opacity-20 hover:bg-white hover:bg-opacity-30 text-white font-medium rounded-lg transition flex justify-center items-center gap-2">
                    Submit <span>→</span>
                </button>
            </form>
        </div>
    </div>

    <!-- FOOTER BOTTOM -->
    <!-- <div class="pt-12 text-center text-xs text-gray-200 border-t border-white/20 mt-10">
            © 2026 AD<span class="text-black">RYZE</span>. All rights reserved.
        </div> -->
</footer>

<script>
    function transferEmail(event) {
        event.preventDefault();
        const emailValue = document.getElementById('hero-email-input').value;
        const contactSection = document.getElementById('contact');
        const contactInput = document.getElementById('contact-email');

        contactSection.scrollIntoView({ behavior: 'smooth' });

        setTimeout(() => {
            contactInput.value = emailValue;
            contactInput.style.borderColor = "#DC2626";
            contactInput.style.backgroundColor = "#FEF2F2";
            document.querySelector('input[name="name"]').focus();
        }, 500);
    }
    document.addEventListener('DOMContentLoaded', () => {
        const prefillEmail = localStorage.getItem('prefillEmail');
        if (prefillEmail) {
            const contactInput = document.getElementById('contact-email');
            contactInput.value = prefillEmail;

            // Highlight the field
            // contactInput.style.borderColor = "#f0f4f5";
            contactInput.style.backgroundColor = "#f0f4f5";
            contactInput.style.color = "#000000";

            // Focus on the name input
            const nameInput = document.querySelector('input[name="name"]');
            if (nameInput) nameInput.focus();

            // Scroll to form
            document.getElementById('contact').scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Clear the localStorage so it doesn't persist
            localStorage.removeItem('prefillEmail');
        }
    });
</script>
